name: Live Capability Router

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  route:
    if: startsWith(github.event.issue.title, 'route:') || startsWith(github.event.issue.title, 'Route:')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cto-legends coordinator
        run: |
          python -m pip install --upgrade pip
          pip install "https://github.com/avalonreset/cto-legends/releases/download/v0.3.0/cto_legends-0.3.0-py3-none-any.whl"

      - name: Process Routing Query
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          python scripts/route_issue.py

      - name: Post Comment to Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file comment.md

      - name: Close Issue as Completed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue close "$ISSUE_NUMBER" --reason completed
