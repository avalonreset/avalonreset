@keyframes sweep7{0%,100%{transform:translateX(-99px)}28%{transform:translateX(847px)}57%{transform:translateX(281px)}79%{transform:translateX(903px)}} .s7{animation:sweep7 10.991s cubic-bezier(.45,0,.55,1) -12.117s infinite;}
@media(prefers-reduced-motion:reduce){.scanner{animation:none!important;transform:translateX(440px)}} </style><g clip-path="url(#crop)">
